name: Build and Release Maths War APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Maths War APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was produced during build!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-artifacts/Maths-War-v1.0.0.apk
          ls -lh release-artifacts/Maths-War-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maths-War-v1.0.0-APK
          path: release-artifacts/Maths-War-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Maths War ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          files: release-artifacts/Maths-War-v1.0.0.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
