name: Android CI & APK Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Configure Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Generation
        run: |
          mkdir -p build-apk-output
          APK_DEBUG=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          APK_RELEASE=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_DEBUG" ]; then
            cp "$APK_DEBUG" build-apk-output/Maths-War-debug.apk
            echo "Found debug APK: $APK_DEBUG"
          fi
          if [ -n "$APK_RELEASE" ]; then
            cp "$APK_RELEASE" build-apk-output/Maths-War-release.apk
            echo "Found release APK: $APK_RELEASE"
          fi
          ls -la build-apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maths-War-debug-APK
          path: build-apk-output/Maths-War-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maths-War-release-APK
          path: build-apk-output/Maths-War-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Maths War Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          files: build-apk-output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
