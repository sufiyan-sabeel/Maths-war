name: Build and Release Maths War APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build & Release Maths War APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Setup Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          mkdir -p ~/.android
          if [ -f ./debug.keystore ]; then
            cp ./debug.keystore ~/.android/debug.keystore
          fi

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and Package APK
        run: |
          mkdir -p release-artifacts
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Found Release APK: $RELEASE_APK"
          cp "$RELEASE_APK" release-artifacts/Maths-War-v1.0.0.apk
          ls -lh release-artifacts/Maths-War-v1.0.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maths-war-v1.0.0-apk
          path: release-artifacts/Maths-War-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Maths War ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          files: release-artifacts/Maths-War-v1.0.0.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
