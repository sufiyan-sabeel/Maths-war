name: Android CI & APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Maths War APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Setup Environment File
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Verify Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ./gradlew --version
          sdkmanager --version
          adb version

      - name: Show Installed Android SDK
        run: |
          sdkmanager --list_installed

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APKs
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Verify APK Generation
        shell: bash
        run: |
          set -e

          DEBUG_APK=$(find . -type f -name "*debug*.apk" | head -n 1)
          RELEASE_APK=$(find . -type f -name "*release*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maths-war-debug
          path: "**/*debug*.apk"
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: maths-war-release
          path: "**/*release*.apk"
          if-no-files-found: error
